[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adna_validation*"]

[project]
name = "adna-validation-service"
version = "0.1.0"
description = "Validates AgentDNA signed calls before they reach the app: whitelist, GRADE, CBAC"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"

authors = [
  { name = "Shreya Patil"},
]

dependencies = [
  # Signed HTTP calls: agentdna PR #83. Pinned to its branch until it is released.
  "agent-dna @ git+https://github.com/agent-dna/agentdna@shreya/http-calls",
  "requests>=2.0.0",
  "starlette",
]

[project.urls]
Repository = "https://github.com/agent-dna/adna-validation-service"

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=8.0.0",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC"]
ignore = ["ISC001", "E501", "B904"]

[tool.pyright]
typeCheckingMode = "basic"
reportAttributeAccessIssue = "none"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["adna_validation"]
exclude = ["examples", ".venv", "**/__pycache__"]
